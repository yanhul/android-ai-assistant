name: CI Feedback

on:
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  feedback:
    if: ${{ github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Summarize CI result
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo "CI conclusion: ${CONCLUSION}"
          echo "Commit: ${SHA}"
          echo "Run: ${RUN_ID}"
          if [ "${CONCLUSION}" != "success" ]; then
            echo "CI_FAILED=true" >> "$GITHUB_STEP_SUMMARY"
            echo "CI failed. Inspect the originating Android CI run; autonomous repair must occur on an agent branch within the policy budget." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "CI_PASS=true" >> "$GITHUB_STEP_SUMMARY"
          echo "CI passed." >> "$GITHUB_STEP_SUMMARY"
