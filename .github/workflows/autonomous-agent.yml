name: Autonomous Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Roadmap task ID to start from (for example T005)'
        required: false
        default: ''
      max_iterations:
        description: 'Maximum repair iterations'
        required: false
        default: '3'

# IMPORTANT: This workflow is an orchestration shell. It deliberately does not
# contain an LLM provider or secret. Configure the approved coding-agent action
# and its external secret before enabling unattended repository writes.
permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate autonomous policy
        run: |
          test -f ROADMAP.md
          test -f AGENT_POLICY.md
          grep -q 'Default maximum autonomous repair iterations per task: 3' AGENT_POLICY.md
          echo "Autonomous policy present. No coding agent is invoked until an approved provider/action is configured."
      - name: Print requested start point
        env:
          TASK: ${{ inputs.task }}
          MAX_ITERATIONS: ${{ inputs.max_iterations }}
        run: |
          echo "Requested task: ${TASK:-first unblocked TODO}"
          echo "Iteration budget: ${MAX_ITERATIONS}"

  # Provider integration intentionally remains disabled until credentials and
  # an approved coding-agent runtime are configured. This prevents a false
  # claim of autonomous execution and prevents an unusable workflow from
  # making arbitrary repository changes.
  agent-not-configured:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Explain activation boundary
        run: |
          echo "Autonomous loop scaffold installed."
          echo "Activation requires an approved coding-agent runtime and secret configured by the repository owner."
          echo "The workflow will not fabricate an LLM call or guess a provider."
