name: Autonomous Agent

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      task:
        description: 'Optional roadmap task ID to start from (for example T005)'
        required: false
        default: ''
      max_iterations:
        description: 'Maximum repair iterations'
        required: false
        default: '3'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: android-assistant-autonomous
  cancel-in-progress: false

env:
  AGENT_BRANCH: agent/autonomous

jobs:
  control-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate immutable control plane
        run: |
          test -f ROADMAP.md
          test -f AGENT_POLICY.md
          test -f harness/HARNESS.md
          test -f harness/controller.py
          grep -q 'Default maximum autonomous repair iterations per task: 3' AGENT_POLICY.md
          grep -q 'The agent may not modify this policy' AGENT_POLICY.md
          python harness/aios_conformance.py

      - name: Runtime adversarial conformance
        run: python harness/adversarial_conformance.py

      - name: Prepare durable agent branch
        run: |
          git fetch origin main
          if git ls-remote --exit-code --heads origin "${AGENT_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${AGENT_BRANCH}:${AGENT_BRANCH}"
            git checkout "${AGENT_BRANCH}"
          else
            git checkout -b "${AGENT_BRANCH}" origin/main
          fi

      - name: Observe and decide
        id: controller
        run: |
          python harness/controller.py | tee controller.out
          if grep -q '^ACT:' controller.out; then
            task="$(sed -n 's/^ACT://p' controller.out | tail -1)"
            iteration="$(sed -n 's/^ITERATION://p' controller.out | tail -1)"
            echo "task=${task}" >> "$GITHUB_OUTPUT"
            echo "iteration=${iteration}" >> "$GITHUB_OUTPUT"
          else
            echo "No ACT state; controller result:"
            cat controller.out
          fi

      - name: Persist pre-action checkpoint
        run: |
          git add harness/state.json
          if ! git diff --cached --quiet; then
            git commit -m "harness: checkpoint autonomous ACT [skip ci]"
          fi
          git push --set-upstream origin "${AGENT_BRANCH}"

      - name: Execute bounded agent pass
        if: steps.controller.outputs.task != ''
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the bounded ACT executor in the repository's durable harness.

            Task: ${{ steps.controller.outputs.task }}
            Iteration: ${{ steps.controller.outputs.iteration }}

            Follow AGENT_POLICY.md and harness/HARNESS.md exactly.
            Read ROADMAP.md, the current implementation, tests, and harness/state.json.
            Observe the latest CI result for this branch before deciding what to change.
            Implement ONLY the selected roadmap task or an evidence-supported repair of it.
            Run the strongest available Gradle/unit checks before declaring success.
            If CI previously failed, inspect the actual failure and fix only the proven cause.
            Persist useful evidence in the normal project artifacts.
            Do not invent API behavior, Android behavior, versions, test results, or performance data.
            Do not modify AGENT_POLICY.md, harness/HARNESS.md, harness/controller.py, this workflow,
            or acceptance/terminal criteria. Do not weaken tests or permissions.
            Do not perform destructive Android actions.
            If the task cannot be safely completed within this iteration, leave the repository in a
            reviewable state and report the blocker; do not fabricate PASS.
            Commit the implementation and tests/docs required for the task to this agent branch.
          claude_args: |
            --max-turns 12
            --allowedTools "Read,Edit,Write,Bash(git:*),Bash(./gradlew:*),Bash(gh run:*),Bash(gh pr:*)"
            --append-system-prompt "The durable harness is authoritative. You are an executor, not the policy owner. Never edit policy, gates, or terminal conditions."

      - name: Verify protected control plane was not changed
        run: |
          git diff --name-only origin/main...HEAD > changed.txt || true
          for protected in AGENT_POLICY.md harness/HARNESS.md harness/controller.py .github/workflows/autonomous-agent.yml; do
            if grep -qx "$protected" changed.txt; then
              echo "Protected control-plane file changed: $protected"
              exit 1
            fi
          done

      - name: Push agent changes
        run: |
          git push origin "${AGENT_BRANCH}"

      - name: Create or update PR
        id: pr
        continue-on-error: true
        run: |
          if gh pr view "${AGENT_BRANCH}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            number="$(gh pr view "${AGENT_BRANCH}" --repo "${GITHUB_REPOSITORY}" --json number --jq .number)"
            echo "number=${number}" >> "$GITHUB_OUTPUT"
            echo "PR_STATUS=EXISTING:${number}" >> "$GITHUB_ENV"
          elif [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            if output="$(gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${AGENT_BRANCH}" --title "autonomous: continue roadmap loop" --body "Durable autonomous harness iteration. Governed by AGENT_POLICY.md and required CI checks." 2>&1)"; then
              number="${output##*/}"
              echo "number=${number}" >> "$GITHUB_OUTPUT"
              echo "PR_STATUS=CREATED:${number}" >> "$GITHUB_ENV"
            else
              echo "PR_STATUS=BLOCKED:CREATE_PULL_REQUEST_PERMISSION" >> "$GITHUB_ENV"
              echo "PR creation blocked by repository Actions permission; branch remains durable and reviewable."
              exit 0
            fi
          else
            echo "number=" >> "$GITHUB_OUTPUT"
            echo "PR_STATUS=NO_CHANGES" >> "$GITHUB_ENV"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Persist final checkpoint
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=Path('harness/state.json')
          s=json.loads(p.read_text())
          s['pr_status']=os.environ.get('PR_STATUS','UNSET')
          if s['pr_status'].startswith('BLOCKED:'):
              s['phase']='HOLD'
              s['result']='HOLD: PR_PERMISSION'
              s['last_error']='GitHub Actions token is not permitted to create pull requests'
          p.write_text(json.dumps(s,indent=2,sort_keys=True)+'\n')
          PY
          git add harness/state.json
          if ! git diff --cached --quiet; then
            git commit -m "harness: persist autonomous PR boundary [skip ci]"
            git push origin "${AGENT_BRANCH}"
          fi

      - name: Enable bounded auto-merge
        if: steps.pr.outputs.number != ''
        run: |
          gh pr merge "${{ steps.pr.outputs.number }}" --repo "${GITHUB_REPOSITORY}" --squash --auto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-controller-state
          path: harness/state.json
          if-no-files-found: error
