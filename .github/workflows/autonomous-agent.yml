name: Autonomous Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Roadmap task ID to start from (for example T005)'
        required: false
        default: ''
      max_iterations:
        description: 'Maximum repair iterations'
        required: false
        default: '3'
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: android-assistant-autonomous
  cancel-in-progress: false

jobs:
  control-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate immutable policy
        run: |
          test -f ROADMAP.md
          test -f AGENT_POLICY.md
          test -f harness/HARNESS.md
          grep -q 'Default maximum autonomous repair iterations per task: 3' AGENT_POLICY.md

      - name: Observe and resume durable controller
        env:
          REQUESTED_TASK: ${{ inputs.task }}
        run: |
          if [ -n "${REQUESTED_TASK}" ]; then
            echo "Requested task: ${REQUESTED_TASK}"
          fi
          python harness/controller.py

      # The agent runtime remains an explicit activation boundary. This job
      # never fabricates a provider call or silently grants unattended edits.
      - name: Verify activation boundary
        run: |
          echo "Durable control checkpoint created."
          echo "Approved coding-agent runtime is required for ACT."

      - name: Persist controller checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/state.json
          if git diff --cached --quiet; then
            echo "No controller state change."
          else
            git commit -m "harness: persist assistant controller checkpoint [skip ci]"
            git push
          fi

      - name: Publish checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: assistant-controller-state
          path: harness/state.json
          if-no-files-found: error
